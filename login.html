<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Portal Login</title>
  <style>
    body {
      background: linear-gradient(to right, #667eea, #764ba2);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 300px;
    }

    h1 {
      color: #333;
      margin-bottom: 24px;
    }

    button {
      background-color: #5a67d8;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 0;
      width: 100%;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #434190;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Attendance Portal</h1>
    <button onclick="location.href='teacher-login.html'">Teacher Login</button>
    <button onclick="location.href='student-login.html'">Student Login</button>
  </div>
</body>
</html>
