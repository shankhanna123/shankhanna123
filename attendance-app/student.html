<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Attendance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 400px;
      margin: auto;
    }
    h2 {
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h2>Mark Your Attendance</h2>
  <input type="text" id="studentName" placeholder="Enter your name" required />
  <input type="text" id="attendanceCode" placeholder="Enter attendance code" required />
  <button onclick="submitAttendance()">Submit</button>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <script>
    // ✅ Replace with your actual Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
      authDomain: "attendance-d7de7.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
      projectId: "attendance-d7de7",
      storageBucket: "attendance-d7de7.firebasestorage.app",
      messagingSenderId: "470494624998",
      appId: "1:470494624998:web:be5b5bdfb9b515d079cf27",
      measurementId: "G-VML3R5N55W"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);

    // Submit attendance
    function submitAttendance() {
      const name = document.getElementById("studentName").value.trim();
      const code = document.getElementById("attendanceCode").value.trim();

      if (!name || !code) {
        alert("Please enter both name and attendance code.");
        return;
      }

      const timestamp = new Date().toISOString();

      // Save attendance in Firebase
      db.ref(`attendance/${code}/${name}`).set({
        timestamp: timestamp
      }).then(() => {
        alert("✅ Attendance recorded successfully!");
        document.getElementById("studentName").value = "";
        document.getElementById("attendanceCode").value = "";
      }).catch((error) => {
        console.error("❌ Error saving attendance:", error);
        alert("Something went wrong. Try again later.");
      });
    }
  </script>
</body>
</html>
