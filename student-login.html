<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f3f3f3;
    }
    .login-container {
      margin-top: 100px;
      background-color: white;
      padding: 30px;
      display: inline-block;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
    input {
      padding: 10px;
      margin: 10px;
      width: 80%;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #4285f4;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #357ae8;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Student Login</h2>
    <input type="text" id="enrollment" placeholder="Enrollment Number" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button onclick="studentLogin()">Login</button>
    <p id="login-status" style="color: red; margin-top: 10px;"></p>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
  authDomain: "attendance-d7de7.firebaseapp.com",
  databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
  projectId: "attendance-d7de7",
  storageBucket: "attendance-d7de7.appspot.com",
  messagingSenderId: "470494624998",
  appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function studentLogin() {
      const enrollment = document.getElementById('enrollment').value.trim();
      const password = document.getElementById('password').value.trim();
      const status = document.getElementById('login-status');

      if (!enrollment || !password) {
        status.innerText = "Please enter both fields.";
        return;
      }

      // Student UID is enrollment number
      // Email used in Firebase Auth is a dummy: enrollment@students.com
      const email = `${enrollment}@students.com`;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          status.style.color = 'green';
          status.innerText = "Login successful! Redirecting...";
          setTimeout(() => {
            window.location.href = "student-dashboard.html"; // replace with your dashboard
          }, 1000);
        })
        .catch((error) => {
          console.error(error);
          status.innerText = "Invalid credentials. Try again.";
        });
    }
  </script>
</body>
</html>
