<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      text-align: center;
      padding-top: 100px;
    }
    .login-container {
      display: inline-block;
      padding: 40px;
      border: 1px solid #ccc;
      background-color: #fff;
      border-radius: 10px;
    }
    input {
      margin: 10px;
      padding: 10px;
      width: 250px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Student Login</h2>
    <input type="text" id="enrollment" placeholder="Enrollment Number" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button onclick="login()">Login</button>
  </div>

  <script>
    // TODO: Replace with your Firebase project config
    const firebaseConfig = {
  apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
  authDomain: "attendance-d7de7.firebaseapp.com",
  databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
  projectId: "attendance-d7de7",
  storageBucket: "attendance-d7de7.appspot.com",
  messagingSenderId: "470494624998",
  appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
};

    firebase.initializeApp(firebaseConfig);

    function login() {
      const enrollment = document.getElementById("enrollment").value.trim();
      const password = document.getElementById("password").value.trim();

      if (enrollment === "" || password === "") {
        alert("Please enter both Enrollment Number and Password.");
        return;
      }

      const email = enrollment + "@student.attendance.com";

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Successful login
          alert("Login successful!");
          // Redirect to student dashboard
          window.location.href = "student.html";
        })
        .catch((error) => {
          console.error("Login error:", error.code, error.message);
          if (error.code === "auth/user-not-found") {
            alert("User not found. Please contact your teacher.");
          } else if (error.code === "auth/wrong-password") {
            alert("Incorrect password. Try again.");
          } else {
            alert("Login failed: " + error.message);
          }
        });
    }
  </script>

</body>
</html>
