<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e3eeff 0%, #f9faff 100%);
      color: #222;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .login-container {
      background: #fff;
      max-width: 400px;
      margin: 60px auto 0 auto;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(67, 100, 247, 0.07);
      padding: 36px 32px 32px 32px;
    }
    h2 {
      color: #4364f7;
      font-weight: 700;
      margin-top: 0;
      text-align: center;
    }
    input, select {
      width: 100%;
      padding: 13px 13px;
      margin: 10px 0 18px 0;
      border: 1.3px solid #e5e9f2;
      border-radius: 7px;
      font-size: 1.01rem;
      background: #f7faff;
      font-family: inherit;
      transition: border 0.2s;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border: 1.3px solid #8fb7fc;
      background: #f2f7ff;
    }
    button {
      background: linear-gradient(90deg, #4364f7 0%, #6fb1fc 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.01rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(67, 100, 247, 0.08);
      margin: 0 4px 10px 0;
      transition: background 0.18s, transform 0.12s;
      width: 100%;
    }
    button:hover {
      background: linear-gradient(90deg, #3350b7 0%, #5191e1 100%);
      transform: translateY(-1px) scale(1.02);
    }
    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
      transform: none;
    }
    .success-message {
      color: #178c18;
      font-weight: 500;
      text-align: center;
      padding: 10px;
      background: #f0f9f0;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }
    .error-message {
      color: #e25353;
      font-weight: 500;
      text-align: center;
      padding: 10px;
      background: #fff0f0;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }
    .info-message {
      color: #2563eb;
      font-weight: 500;
      text-align: center;
      padding: 10px;
      background: #eff6ff;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }
    .attendance-section {
      margin-top: 28px;
      padding: 20px 12px 10px 12px;
      background: #f8fbff;
      border-radius: 12px;
      box-shadow: 0 1px 8px rgba(67, 100, 247, 0.04);
      display: none;
    }
    .attendance-timer {
      font-weight: 600;
      color: #e25353;
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }
    .code-input {
      text-align: center !important;
      font-size: 1.4rem !important;
      font-weight: bold !important;
      letter-spacing: 3px !important;
      text-transform: uppercase !important;
    }
    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
    .debug-info {
      background: #f0f8ff;
      border: 1px solid #4364f7;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 12px;
      color: #4364f7;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Student Login</h2>
    <input type="text" id="enrollment-input" placeholder="Enrollment Number" required />
    <input type="password" id="password-input" placeholder="Password" required />
    <button id="login-btn">Login</button>
    <div id="login-message"></div>

    <div class="attendance-section" id="attendance-section">
      <h3 style="text-align: center; color: #4364f7; margin-bottom: 20px;">📋 Mark Attendance</h3>
      <div class="attendance-timer" id="attendance-timer"></div>
      <div id="session-info" class="info-message"></div>
      <input type="text" id="attendance-code-input" class="code-input" 
             placeholder="ENTER CODE" maxlength="6" />
      <button id="submit-attendance-btn">✓ Submit Attendance</button>
      <div id="attendance-message"></div>
      <div id="debug-info" class="debug-info"></div>
    </div>
  </div>

  <!-- Firebase Configuration -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
      authDomain: "attendance-d7de7.firebaseapp.com",
      databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
      projectId: "attendance-d7de7",
      storageBucket: "attendance-d7de7.appspot.com",
      messagingSenderId: "470494624998",
      appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
    };
    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();
    let loggedInStudent = null;
    let attendanceTimer = null;
    let currentActiveSession = null;

    // Utility functions
    function showMessage(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.className = type + '-message';
      element.style.display = 'block';
      
      if (type === 'success') {
        setTimeout(() => element.style.display = 'none', 8000);
      }
    }

    function hideMessage(elementId) {
      document.getElementById(elementId).style.display = 'none';
    }

    function debugLog(message, data = null) {
      console.log(message, data);
      const debugDiv = document.getElementById('debug-info');
      debugDiv.innerHTML += `<div>${message} ${data ? JSON.stringify(data, null, 2) : ''}</div>`;
      debugDiv.style.display = 'block';
    }

    // Login functionality
    document.getElementById('login-btn').addEventListener('click', function() {
      const enrollment = document.getElementById('enrollment-input').value.trim();
      const password = document.getElementById('password-input').value;
      const loginBtn = document.getElementById('login-btn');

      if (!enrollment || !password) {
        showMessage('login-message', 'Please enter both enrollment number and password', 'error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      showMessage('login-message', 'Verifying credentials...', 'info');

      database.ref('students/' + enrollment).once('value')
        .then(snapshot => {
          if (snapshot.exists()) {
            const studentData = snapshot.val();
            if (studentData.password === password) {
              loggedInStudent = {
                enrollment: enrollment,
                name: studentData.name || 'Student',
                ...studentData
              };
              
              showMessage('login-message', `Welcome ${loggedInStudent.name}! 🎉`, 'success');
              document.getElementById('attendance-section').style.display = 'block';
              checkForActiveAttendance();
            } else {
              showMessage('login-message', 'Invalid password. Please try again.', 'error');
            }
          } else {
            showMessage('login-message', 'Enrollment number not found. Please check and try again.', 'error');
          }
        })
        .catch(error => {
          console.error('Login error:', error);
          showMessage('login-message', 'Login failed. Please try again.', 'error');
        })
        .finally(() => {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        });
    });

    // Enhanced attendance checking with multiple database paths
    function checkForActiveAttendance() {
      if (!loggedInStudent) return;

      debugLog('Starting attendance check for student:', loggedInStudent.enrollment);

      // Check multiple possible database paths where teacher might store attendance
      const possiblePaths = [
        'attendance',
        'attendanceSessions', 
        'activeAttendance',
        'sessions',
        'teacherSessions',
        'subjects'
      ];

      // First, let's see what's in the root of the database
      database.ref().once('value').then(rootSnapshot => {
        debugLog('Database root keys:', Object.keys(rootSnapshot.val() || {}));
        
        // Check each possible path
        checkAttendancePaths(possiblePaths, 0);
      });

      // Also listen for real-time changes on all possible paths
      possiblePaths.forEach(path => {
        database.ref(path).on('value', snapshot => {
          if (snapshot.exists()) {
            debugLog(`Found data at path: ${path}`, snapshot.val());
            processAttendanceData(snapshot.val(), path);
          }
        });
      });
    }

    function checkAttendancePaths(paths, index) {
      if (index >= paths.length) {
        // If no active sessions found in any path, show waiting message
        if (!currentActiveSession) {
          showMessage('attendance-message', 
            '⏳ No active attendance session found. Waiting for teacher to start...', 
            'info');
        }
        return;
      }

      const currentPath = paths[index];
      debugLog(`Checking path: ${currentPath}`);

      database.ref(currentPath).once('value')
        .then(snapshot => {
          if (snapshot.exists()) {
            debugLog(`Data found at ${currentPath}:`, snapshot.val());
            const foundSession = processAttendanceData(snapshot.val(), currentPath);
            if (!foundSession) {
              checkAttendancePaths(paths, index + 1);
            }
          } else {
            debugLog(`No data at path: ${currentPath}`);
            checkAttendancePaths(paths, index + 1);
          }
        })
        .catch(error => {
          debugLog(`Error checking path ${currentPath}:`, error.message);
          checkAttendancePaths(paths, index + 1);
        });
    }

    function processAttendanceData(data, pathName) {
      if (!data) return false;

      currentActiveSession = null;
      
      // Handle different data structures
      for (let sessionId in data) {
        const session = data[sessionId];
        
        // Check various possible session structures
        const isActive = session.isActive || 
                         session.active || 
                         session.status === 'active' ||
                         session.state === 'active' ||
                         (session.endTime && session.endTime > Date.now());

        if (isActive) {
          currentActiveSession = { 
            id: sessionId, 
            path: pathName,
            ...session 
          };
          
          debugLog('Found active session:', currentActiveSession);
          
          const teacherName = session.teacherName || session.teacher || session.createdBy || 'Your Teacher';
          const subject = session.subject || session.subjectName || session.className || 'Class';
          
          showMessage('attendance-message', 
            `✅ Active session: ${subject} by ${teacherName}`, 
            'info');
          
          document.getElementById('session-info').innerHTML = 
            `<strong>Subject:</strong> ${subject}<br><strong>Teacher:</strong> ${teacherName}`;
          document.getElementById('session-info').style.display = 'block';

          if (session.endTime) {
            startAttendanceTimer(session.endTime);
          }
          
          checkAttendanceStatus(sessionId, pathName);
          return true;
        }
      }
      
      return false;
    }

    function checkAttendanceStatus(sessionId, pathName) {
      if (!loggedInStudent) return;

      const attendanceRef = database.ref(`${pathName}/${sessionId}/students/${loggedInStudent.enrollment}`);
      
      attendanceRef.once('value').then(snapshot => {
        if (snapshot.exists()) {
          const attendanceRecord = snapshot.val();
          showMessage('attendance-message', 
            `✅ Attendance already marked at ${new Date(attendanceRecord.timestamp).toLocaleTimeString()}`, 
            'success');
          document.getElementById('submit-attendance-btn').disabled = true;
          document.getElementById('submit-attendance-btn').textContent = 'Attendance Marked ✓';
        } else {
          document.getElementById('submit-attendance-btn').disabled = false;
          document.getElementById('submit-attendance-btn').textContent = '✓ Submit Attendance';
        }
      }).catch(error => {
        debugLog('Error checking attendance status:', error.message);
      });
    }

    function startAttendanceTimer(endTime) {
      clearAttendanceTimer();
      
      attendanceTimer = setInterval(() => {
        const now = Date.now();
        const timeLeft = endTime - now;
        
        if (timeLeft <= 0) {
          document.getElementById('attendance-timer').textContent = '⏰ Session Expired';
          clearAttendanceTimer();
          showMessage('attendance-message', 'Session has ended. Please wait for the next one.', 'error');
          return;
        }
        
        const minutes = Math.floor(timeLeft / 60000);
        const seconds = Math.floor((timeLeft % 60000) / 1000);
        document.getElementById('attendance-timer').textContent = 
          `⏰ Time Remaining: ${minutes}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    function clearAttendanceTimer() {
      if (attendanceTimer) {
        clearInterval(attendanceTimer);
        attendanceTimer = null;
      }
      document.getElementById('attendance-timer').textContent = '';
    }

    // Attendance submission with enhanced error handling
    document.getElementById('submit-attendance-btn').addEventListener('click', function() {
      const codeInput = document.getElementById('attendance-code-input').value.trim().toUpperCase();
      const submitBtn = document.getElementById('submit-attendance-btn');

      if (!loggedInStudent) {
        showMessage('attendance-message', 'Please log in first', 'error');
        return;
      }

      if (!currentActiveSession) {
        showMessage('attendance-message', 'No active attendance session found', 'error');
        return;
      }

      if (!codeInput || codeInput.length < 4) {
        showMessage('attendance-message', 'Please enter the attendance code', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying Code...';

      debugLog('Submitting code:', codeInput);
      debugLog('Session code:', currentActiveSession.code);

      // Try different possible code formats
      const sessionCode = (currentActiveSession.code || currentActiveSession.attendanceCode || 
                          currentActiveSession.sessionCode || '').toString().toUpperCase();

      if (codeInput === sessionCode) {
        // Mark attendance
        const attendanceRecord = {
          studentName: loggedInStudent.name,
          enrollment: loggedInStudent.enrollment,
          timestamp: Date.now(),
          status: 'present',
          submittedCode: codeInput
        };

        const attendancePath = `${currentActiveSession.path}/${currentActiveSession.id}/students/${loggedInStudent.enrollment}`;
        
        database.ref(attendancePath).set(attendanceRecord)
          .then(() => {
            showMessage('attendance-message', 
              '🎉 Attendance marked successfully! You are present.', 
              'success');
            submitBtn.textContent = 'Attendance Marked ✓';
            document.getElementById('attendance-code-input').value = '';
            submitBtn.disabled = true;
            
            // Also update attendance count if it exists
            const countRef = database.ref(`${currentActiveSession.path}/${currentActiveSession.id}/attendanceCount`);
            countRef.transaction(currentCount => (currentCount || 0) + 1);
            
          })
          .catch(error => {
            console.error('Error marking attendance:', error);
            debugLog('Attendance submission error:', error.message);
            showMessage('attendance-message', 
              'Failed to mark attendance. Please try again.', 
              'error');
            submitBtn.disabled = false;
            submitBtn.textContent = '✓ Submit Attendance';
          });
      } else {
        showMessage('attendance-message', 
          'Invalid code. Please check with your teacher and try again.', 
          'error');
        debugLog('Code mismatch. Expected:', sessionCode, 'Got:', codeInput);
        submitBtn.disabled = false;
        submitBtn.textContent = '✓ Submit Attendance';
      }
    });

    // Enter key support
    document.getElementById('password-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    document.getElementById('attendance-code-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('submit-attendance-btn').click();
    });

    // Auto-format code input
    document.getElementById('attendance-code-input').addEventListener('input', function(e) {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    // Auto-refresh every 30 seconds to check for new sessions
    setInterval(() => {
      if (loggedInStudent && !currentActiveSession) {
        checkForActiveAttendance();
      }
    }, 30000);
  </script>
</body>
</html>
