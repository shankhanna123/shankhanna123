<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e3eeff 0%, #f9faff 100%);
      color: #222;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .login-container {
      background: #fff;
      max-width: 400px;
      margin: 60px auto 0 auto;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(67, 100, 247, 0.07);
      padding: 36px 32px 32px 32px;
    }
    h2 {
      color: #4364f7;
      font-weight: 700;
      margin-top: 0;
      text-align: center;
    }
    input, select {
      width: 100%;
      padding: 13px 13px;
      margin: 10px 0 18px 0;
      border: 1.3px solid #e5e9f2;
      border-radius: 7px;
      font-size: 1.01rem;
      background: #f7faff;
      font-family: inherit;
      transition: border 0.2s;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border: 1.3px solid #8fb7fc;
      background: #f2f7ff;
    }
    button {
      background: linear-gradient(90deg, #4364f7 0%, #6fb1fc 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.01rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(67, 100, 247, 0.08);
      margin: 0 4px 10px 0;
      transition: background 0.18s, transform 0.12s;
      width: 100%;
    }
    button:hover {
      background: linear-gradient(90deg, #3350b7 0%, #5191e1 100%);
      transform: translateY(-1px) scale(1.02);
    }
    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
      transform: none;
    }
    .success-message {
      color: #178c18;
      font-weight: 500;
      text-align: center;
      padding: 10px;
      background: #f0f9f0;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }
    .error-message {
      color: #e25353;
      font-weight: 500;
      text-align: center;
      padding: 10px;
      background: #fff0f0;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }
    .info-message {
      color: #2563eb;
      font-weight: 500;
      text-align: center;
      padding: 10px;
      background: #eff6ff;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }
    .attendance-section {
      margin-top: 28px;
      padding: 20px 12px 10px 12px;
      background: #f8fbff;
      border-radius: 12px;
      box-shadow: 0 1px 8px rgba(67, 100, 247, 0.04);
      display: none;
    }
    .attendance-timer {
      font-weight: 600;
      color: #e25353;
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }
    .code-input {
      text-align: center !important;
      font-size: 1.4rem !important;
      font-weight: bold !important;
      letter-spacing: 3px !important;
      text-transform: uppercase !important;
    }
    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
    .debug-info {
      background: #f0f8ff;
      border: 1px solid #4364f7;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 12px;
      color: #4364f7;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Student Login</h2>
    <input type="text" id="enrollment-input" placeholder="Enrollment Number" required />
    <input type="password" id="password-input" placeholder="Password" required />
    <button id="login-btn">Login</button>
    <div id="login-message"></div>

    <div class="attendance-section" id="attendance-section">
      <h3 style="text-align: center; color: #4364f7; margin-bottom: 20px;">📋 Mark Attendance</h3>
      <div class="attendance-timer" id="attendance-timer"></div>
      <div id="session-info" class="info-message"></div>
      <input type="text" id="attendance-code-input" class="code-input" 
             placeholder="ENTER CODE" maxlength="6" />
      <button id="submit-attendance-btn">✓ Submit Attendance</button>
      <div id="attendance-message"></div>
      <div id="debug-info" class="debug-info"></div>
    </div>
  </div>

  <!-- Firebase Configuration -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
      authDomain: "attendance-d7de7.firebaseapp.com",
      databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
      projectId: "attendance-d7de7",
      storageBucket: "attendance-d7de7.appspot.com",
      messagingSenderId: "470494624998",
      appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
    };
    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();
    let loggedInStudent = null;
    let attendanceTimer = null;
    let currentActiveCode = null;

    // Utility functions
    function showMessage(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.className = type + '-message';
      element.style.display = 'block';
      
      if (type === 'success') {
        setTimeout(() => element.style.display = 'none', 8000);
      }
    }

    function hideMessage(elementId) {
      document.getElementById(elementId).style.display = 'none';
    }

    function debugLog(message, data = null) {
      console.log(message, data);
      const debugDiv = document.getElementById('debug-info');
      debugDiv.innerHTML += `<div><strong>${new Date().toLocaleTimeString()}</strong>: ${message} ${data ? JSON.stringify(data, null, 2) : ''}</div>`;
      debugDiv.style.display = 'block';
      debugDiv.scrollTop = debugDiv.scrollHeight;
    }

    function getTodayDate() {
      const today = new Date();
      return today.toISOString().slice(0, 10);
    }

    // Login functionality
    document.getElementById('login-btn').addEventListener('click', function() {
      const enrollment = document.getElementById('enrollment-input').value.trim();
      const password = document.getElementById('password-input').value;
      const loginBtn = document.getElementById('login-btn');

      if (!enrollment || !password) {
        showMessage('login-message', 'Please enter both enrollment number and password', 'error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      showMessage('login-message', 'Verifying credentials...', 'info');

      database.ref('students/' + enrollment).once('value')
        .then(snapshot => {
          if (snapshot.exists()) {
            const studentData = snapshot.val();
            if (studentData.password === password) {
              loggedInStudent = {
                enrollment: enrollment,
                name: studentData.name || 'Student',
                subject: studentData.subject,
                ...studentData
              };
              
              showMessage('login-message', `Welcome ${loggedInStudent.name}! 🎉`, 'success');
              document.getElementById('attendance-section').style.display = 'block';
              debugLog('Student logged in:', loggedInStudent);
              checkForActiveAttendance();
            } else {
              showMessage('login-message', 'Invalid password. Please try again.', 'error');
            }
          } else {
            showMessage('login-message', 'Enrollment number not found. Please check and try again.', 'error');
          }
        })
        .catch(error => {
          console.error('Login error:', error);
          showMessage('login-message', 'Login failed. Please try again.', 'error');
        })
        .finally(() => {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        });
    });

    // FIXED: Check for active attendance codes (matching teacher.js structure)
    function checkForActiveAttendance() {
      if (!loggedInStudent) return;

      debugLog('Starting attendance check for student:', loggedInStudent.enrollment);

      // Check ALL subjects for active attendance codes
      database.ref('subjects').once('value')
        .then(snapshot => {
          if (!snapshot.exists()) {
            showMessage('attendance-message', 'No subjects found in database.', 'error');
            return;
          }

          const subjects = snapshot.val();
          let activeCodeFound = false;

          debugLog('Found subjects:', Object.keys(subjects));

          // Look for active attendance codes in any subject
          Object.keys(subjects).forEach(subjectKey => {
            const subject = subjects[subjectKey];
            
            if (subject.attendanceCode) {
              const { code, expiry } = subject.attendanceCode;
              const now = Date.now();
              
              debugLog(`Checking subject ${subjectKey}:`, { code, expiry, now, isActive: expiry > now });
              
              if (code && expiry && expiry > now) {
                activeCodeFound = true;
                currentActiveCode = {
                  subjectKey: subjectKey,
                  subjectName: subject.name,
                  code: code,
                  expiry: expiry
                };

                debugLog('Found active attendance code:', currentActiveCode);
                
                // Display session info
                document.getElementById('session-info').innerHTML = 
                  `Active Session: <strong>${subject.name}</strong><br>Code expires in: <span id="countdown"></span>`;
                document.getElementById('session-info').style.display = 'block';
                
                startAttendanceTimer();
                return; // Exit loop once we find an active code
              }
            }
          });

          if (!activeCodeFound) {
            showMessage('attendance-message', 'No active attendance sessions found. Please wait for teacher to generate attendance code.', 'info');
            document.getElementById('session-info').style.display = 'none';
            clearAttendanceTimer();
            currentActiveCode = null;
            debugLog('No active attendance codes found');
          }
        })
        .catch(error => {
          console.error('Error checking attendance:', error);
          showMessage('attendance-message', 'Error checking for active sessions.', 'error');
          debugLog('Error checking attendance:', error);
        });
    }

    // Start attendance timer
    function startAttendanceTimer() {
      if (!currentActiveCode) return;

      clearAttendanceTimer();
      
      attendanceTimer = setInterval(() => {
        const now = Date.now();
        const timeLeft = currentActiveCode.expiry - now;

        if (timeLeft <= 0) {
          document.getElementById('attendance-timer').textContent = '⏰ Session Expired';
          document.getElementById('countdown').textContent = 'Expired';
          clearAttendanceTimer();
          setTimeout(() => {
            checkForActiveAttendance(); // Check for new sessions
          }, 2000);
          return;
        }

        const seconds = Math.floor(timeLeft / 1000);
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;
        
        const timeDisplay = minutes > 0 
          ? `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`
          : `${remainingSeconds}s`;
          
        document.getElementById('attendance-timer').textContent = `⏰ Time Left: ${timeDisplay}`;
        if (document.getElementById('countdown')) {
          document.getElementById('countdown').textContent = timeDisplay;
        }
      }, 1000);
    }

    // Clear attendance timer
    function clearAttendanceTimer() {
      if (attendanceTimer) {
        clearInterval(attendanceTimer);
        attendanceTimer = null;
      }
      document.getElementById('attendance-timer').textContent = '';
    }

    // Submit attendance
    document.getElementById('submit-attendance-btn').addEventListener('click', function() {
      const enteredCode = document.getElementById('attendance-code-input').value.trim().toUpperCase();
      const submitBtn = document.getElementById('submit-attendance-btn');

      if (!currentActiveCode) {
        showMessage('attendance-message', 'No active session found. Please refresh the page.', 'error');
        return;
      }

      if (!enteredCode) {
        showMessage('attendance-message', 'Please enter the attendance code.', 'error');
        return;
      }

      // Check if code is still valid
      if (Date.now() > currentActiveCode.expiry) {
        showMessage('attendance-message', 'Attendance code has expired. Please wait for a new code.', 'error');
        checkForActiveAttendance(); // Refresh
        return;
      }

      if (enteredCode !== currentActiveCode.code) {
        showMessage('attendance-message', 'Incorrect code. Please try again.', 'error');
        debugLog('Code mismatch:', { entered: enteredCode, expected: currentActiveCode.code });
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      hideMessage('attendance-message');

      const { subjectKey } = currentActiveCode;
      const todayDate = getTodayDate();
      const attendanceRef = database.ref(`attendance/${subjectKey}/${todayDate}/${loggedInStudent.enrollment}`);

      debugLog('Submitting attendance:', { subjectKey, todayDate, enrollment: loggedInStudent.enrollment });

      // Check if student already marked attendance today
      attendanceRef.once('value')
        .then(snapshot => {
          if (snapshot.exists()) {
            const existingData = snapshot.val();
            if (existingData.status === 'present') {
              showMessage('attendance-message', '✅ You have already marked attendance today!', 'info');
              debugLog('Already marked present today:', existingData);
              return;
            }
          }

          // Mark attendance as present
          const attendanceData = {
            status: 'present',
            timestamp: Date.now(),
            name: loggedInStudent.name,
            code_used: currentActiveCode.code
          };

          debugLog('Setting attendance data:', attendanceData);

          return attendanceRef.set(attendanceData);
        })
        .then(() => {
          if (arguments.length > 0) { // Only if set was called
            showMessage('attendance-message', '🎉 Attendance marked successfully!', 'success');
            document.getElementById('attendance-code-input').value = '';
            debugLog('Attendance marked successfully');
            
            // Hide attendance section after successful submission
            setTimeout(() => {
              document.getElementById('attendance-section').style.display = 'none';
            }, 3000);
          }
        })
        .catch(error => {
          console.error('Error submitting attendance:', error);
          showMessage('attendance-message', 'Failed to submit attendance. Please try again.', 'error');
          debugLog('Error submitting attendance:', error);
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = '✓ Submit Attendance';
        });
    });

    // Auto-refresh attendance check every 10 seconds
    setInterval(() => {
      if (loggedInStudent && !currentActiveCode) {
        debugLog('Auto-refreshing attendance check');
        checkForActiveAttendance();
      }
    }, 10000);

    // Allow Enter key for login
    document.getElementById('password-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('login-btn').click();
      }
    });

    // Allow Enter key for attendance code
    document.getElementById('attendance-code-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('submit-attendance-btn').click();
      }
    });

    // Auto-convert attendance code to uppercase
    document.getElementById('attendance-code-input').addEventListener('input', function(e) {
      e.target.value = e.target.value.toUpperCase();
    });

    // Initialize
    console.log('Student login system initialized - Fixed for teacher.js compatibility');
  </script>
</body>
</html>
