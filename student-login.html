<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e3eeff 0%, #f9faff 100%);
      color: #222;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .login-container {
      background: #fff;
      max-width: 400px;
      margin: 60px auto 0 auto;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(67, 100, 247, 0.07);
      padding: 36px 32px 32px 32px;
    }
    h2 {
      color: #4364f7;
      font-weight: 700;
      margin-top: 0;
      text-align: center;
    }
    input, select {
      width: 100%;
      padding: 13px 13px;
      margin: 10px 0 18px 0;
      border: 1.3px solid #e5e9f2;
      border-radius: 7px;
      font-size: 1.01rem;
      background: #f7faff;
      font-family: inherit;
      transition: border 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border: 1.3px solid #8fb7fc;
      background: #f2f7ff;
    }
    button {
      background: linear-gradient(90deg, #4364f7 0%, #6fb1fc 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.01rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(67, 100, 247, 0.08);
      margin: 0 4px 10px 0;
      transition: background 0.18s, transform 0.12s;
    }
    button:hover {
      background: linear-gradient(90deg, #3350b7 0%, #5191e1 100%);
      transform: translateY(-1px) scale(1.02);
    }
    .success-message {
      color: #178c18;
      font-weight: 500;
      text-align: center;
    }
    .error-message {
      color: #e25353;
      font-weight: 500;
      text-align: center;
    }
    .attendance-section {
      margin-top: 28px;
      padding: 20px 12px 10px 12px;
      background: #f8fbff;
      border-radius: 12px;
      box-shadow: 0 1px 8px rgba(67, 100, 247, 0.04);
      display: none;
    }
    .attendance-timer {
      font-weight: 600;
      color: #e25353;
      margin-left: 12px;
    }
    .attendance-code-display {
      font-size: 1.13em;
      font-weight: 700;
      margin-top: 6px;
      color: #3960bf;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Student Login</h2>
    <input type="text" id="enrollment-input" placeholder="Enrollment Number" required />
    <input type="password" id="password-input" placeholder="Password" required />
    <button id="login-btn">Login</button>
    <div id="login-message" class="error-message"></div>

    <div class="attendance-section" id="attendance-section">
      <div>
        <span class="attendance-code-display" id="attendance-code-display"></span>
        <span class="attendance-timer" id="attendance-timer"></span>
      </div>
      <input type="text" id="attendance-code-input" placeholder="Enter Attendance Code" maxlength="6" />
      <button id="submit-attendance-btn">Submit Attendance Code</button>
      <div id="attendance-message" class="error-message"></div>
      <div id="attendance-success" class="success-message"></div>
    </div>
  </div>

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="student.js"></script>
</body>
</html>
