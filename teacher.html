<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Teacher Dashboard</h2>

    <div class="card mb-4">
      <div class="card-body">
        <h5>Add Subject</h5>
        <input type="text" id="subjectInput" class="form-control mb-2" placeholder="Enter subject name" />
        <button class="btn btn-primary" onclick="addSubject()">Add Subject</button>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h5>Register Student</h5>
        <input type="text" id="studentName" class="form-control mb-2" placeholder="Student Name" />
        <input type="email" id="studentEmail" class="form-control mb-2" placeholder="Student Email" />
        <input type="password" id="studentPassword" class="form-control mb-2" placeholder="Password" />
        <select id="studentSubject" class="form-control mb-2"></select>
        <button class="btn btn-success" onclick="registerStudent()">Register Student</button>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h5>Generate Attendance Code</h5>
        <select id="codeSubject" class="form-control mb-2"></select>
        <button class="btn btn-warning" onclick="generateCode()">Generate Code</button>
        <p class="mt-2">Current Code: <span id="currentCode"></span></p>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h5>Subjects List</h5>
        <ul id="subjectsList" class="list-group"></ul>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h5>Registered Students</h5>
        <ul id="studentsList" class="list-group"></ul>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5>Export Attendance</h5>
        <select id="exportSubject" class="form-control mb-2"></select>
        <button class="btn btn-outline-primary" onclick="exportToExcel()">Export to Excel</button>
        <button class="btn btn-outline-danger" onclick="exportToPDF()">Export to PDF</button>
      </div>
    </div>
  </div>

  <script>
    // Your Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    function addSubject() {
      const subject = document.getElementById("subjectInput").value;
      if (subject) {
        const ref = db.ref("subjects").push();
        ref.set({ name: subject });
        document.getElementById("subjectInput").value = "";
        loadSubjects();
      }
    }

    function registerStudent() {
      const name = document.getElementById("studentName").value;
      const email = document.getElementById("studentEmail").value;
      const password = document.getElementById("studentPassword").value;
      const subject = document.getElementById("studentSubject").value;
      if (name && email && password && subject) {
        auth.createUserWithEmailAndPassword(email, password).then((cred) => {
          db.ref("students/" + cred.user.uid).set({ name, email, subject });
          document.getElementById("studentName").value = "";
          document.getElementById("studentEmail").value = "";
          document.getElementById("studentPassword").value = "";
          loadStudents();
        });
      }
    }

    function generateCode() {
      const subject = document.getElementById("codeSubject").value;
      const code = Math.floor(100000 + Math.random() * 900000).toString();
      db.ref("attendanceCodes/" + subject).set({ code, timestamp: Date.now() });
      document.getElementById("currentCode").innerText = code;
    }

    function exportToExcel() {
      const subject = document.getElementById("exportSubject").value;
      db.ref("attendance/" + subject).once("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const rows = Object.entries(data).map(([student, status]) => ({ student, status }));
          const ws = XLSX.utils.json_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Attendance");
          XLSX.writeFile(wb, `${subject}_Attendance.xlsx`);
        }
      });
    }

    function exportToPDF() {
      const subject = document.getElementById("exportSubject").value;
      db.ref("attendance/" + subject).once("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          let y = 10;
          doc.text("Attendance Report", 10, y);
          y += 10;
          Object.entries(data).forEach(([student, status]) => {
            doc.text(`${student}: ${status}`, 10, y);
            y += 10;
          });
          doc.save(`${subject}_Attendance.pdf`);
        }
      });
    }

    function loadSubjects() {
      const selects = ["studentSubject", "codeSubject", "exportSubject"];
      selects.forEach(id => document.getElementById(id).innerHTML = "");
      document.getElementById("subjectsList").innerHTML = "";
      db.ref("subjects").on("value", (snapshot) => {
        const data = snapshot.val();
        for (let key in data) {
          const option = `<option value="${key}">${data[key].name}</option>`;
          selects.forEach(id => document.getElementById(id).innerHTML += option);
          document.getElementById("subjectsList").innerHTML += `<li class="list-group-item">${data[key].name}</li>`;
        }
      });
    }

    function loadStudents() {
      document.getElementById("studentsList").innerHTML = "";
      db.ref("students").on("value", (snapshot) => {
        const data = snapshot.val();
        for (let key in data) {
          const student = data[key];
          document.getElementById("studentsList").innerHTML += `<li class="list-group-item">${student.name} - ${student.subject}</li>`;
        }
      });
    }

    loadSubjects();
    loadStudents();
  </script>
</body>
</html>
