<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Teacher Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h2 {
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input, select, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #28a745;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
    .subject-section {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Teacher Dashboard</h2>
    <input type="text" id="subjectInput" placeholder="Enter Subject Name">
    <button onclick="addSubject()">Add Subject</button>
    <div id="subjectsList"></div>
  </div>

  <script>
    // Initialize Firebase
    const firebaseConfig = {
  apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
  authDomain: "attendance-d7de7.firebaseapp.com",
  databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
  projectId: "attendance-d7de7",
  storageBucket: "attendance-d7de7.firebasestorage.app",
  messagingSenderId: "470494624998",
  appId: "1:470494624998:web:be5b5bdfb9b515d079cf27",
  measurementId: "G-VML3R5N55W"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function addSubject() {
      const subject = document.getElementById("subjectInput").value.trim();
      if (subject === "") return alert("Please enter subject name");
      db.ref('subjects/' + subject).set({ createdAt: Date.now() });
      renderSubject(subject);
      document.getElementById("subjectInput").value = '';
    }

    function renderSubject(subject) {
      const container = document.createElement("div");
      container.className = "card subject-section";
      container.innerHTML = `
        <h3>${subject}</h3>
        <div>
          <input type="text" placeholder="Student Name" id="${subject}-name">
          <input type="email" placeholder="Student Email" id="${subject}-email">
          <input type="password" placeholder="Student Password" id="${subject}-pass">
          <button onclick="registerStudent('${subject}')">Register Student</button>
        </div>
        <div>
          <button onclick="generateCode('${subject}')">Generate Code</button>
          <p id="${subject}-codeDisplay"></p>
        </div>
        <div>
          <input type="date" id="${subject}-dateExport">
          <button onclick="exportExcel('${subject}')">Export to Excel</button>
          <button onclick="exportPDF('${subject}')">Export to PDF</button>
        </div>
        <div>
          <h4>Attendance:</h4>
          <ul id="${subject}-attendanceList"></ul>
        </div>
      `;
      document.getElementById("subjectsList").appendChild(container);
      loadAttendance(subject);
    }

    function registerStudent(subject) {
      const name = document.getElementById(`${subject}-name`).value.trim();
      const email = document.getElementById(`${subject}-email`).value.trim();
      const password = document.getElementById(`${subject}-pass`).value;

      if (!name || !email || !password) return alert("All fields required");
      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(user => {
          const uid = user.user.uid;
          db.ref(`students/${uid}`).set({ name, email, subject });
          alert("Student registered!");
        }).catch(err => alert(err.message));
    }

    function generateCode(subject) {
      const code = Math.floor(100000 + Math.random() * 900000).toString();
      db.ref(`codes/${subject}`).set({ code, createdAt: Date.now() });
      document.getElementById(`${subject}-codeDisplay`).innerText = `Code: ${code}`;
    }

    function loadAttendance(subject) {
      db.ref(`attendance/${subject}`).on('value', snapshot => {
        const list = document.getElementById(`${subject}-attendanceList`);
        list.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.entries(data).forEach(([date, records]) => {
            const li = document.createElement('li');
            li.innerText = `${date}: ${Object.keys(records).length} students`;
            list.appendChild(li);
          });
        }
      });
    }

    function exportExcel(subject) {
      const date = document.getElementById(`${subject}-dateExport`).value;
      if (!date) return alert("Select date");
      db.ref(`attendance/${subject}/${date}`).once('value', snapshot => {
        const data = snapshot.val();
        if (!data) return alert("No attendance for this date");
        const rows = [["Name", "Email"]];
        const studentPromises = Object.keys(data).map(uid =>
          db.ref(`students/${uid}`).once('value').then(snap => {
            const student = snap.val();
            rows.push([student.name, student.email]);
          })
        );
        Promise.all(studentPromises).then(() => {
          const wb = XLSX.utils.book_new();
          const ws = XLSX.utils.aoa_to_sheet(rows);
          XLSX.utils.book_append_sheet(wb, ws, subject);
          XLSX.writeFile(wb, `${subject}_${date}.xlsx`);
        });
      });
    }

    function exportPDF(subject) {
      const date = document.getElementById(`${subject}-dateExport`).value;
      if (!date) return alert("Select date");
      db.ref(`attendance/${subject}/${date}`).once('value', snapshot => {
        const data = snapshot.val();
        if (!data) return alert("No attendance for this date");
        const rows = [["Name", "Email"]];
        const studentPromises = Object.keys(data).map(uid =>
          db.ref(`students/${uid}`).once('value').then(snap => {
            const student = snap.val();
            rows.push([student.name, student.email]);
          })
        );
        Promise.all(studentPromises).then(() => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          doc.setFontSize(14);
          doc.text(`Attendance - ${subject} - ${date}`, 10, 10);
          rows.forEach((r, i) => {
            doc.text(`${r[0]} - ${r[1]}`, 10, 20 + i * 10);
          });
          doc.save(`${subject}_${date}.pdf`);
        });
      });
    }

    // Load existing subjects on page load
    window.onload = () => {
      db.ref("subjects").once('value', snapshot => {
        const subjects = snapshot.val();
        if (subjects) {
          Object.keys(subjects).forEach(renderSubject);
        }
      });
    };
  </script>
</body>
</html>
