<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: #f2f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      margin-top: 50px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    label {
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #3730a3;
    }

    #codeDisplay {
      margin-top: 15px;
      text-align: center;
      font-size: 18px;
      color: #111;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Generate Attendance Code</h1>
    <div class="input-group">
      <label for="subject">Enter Subject Name</label>
      <input type="text" id="subject" placeholder="e.g., Mathematics">
    </div>
    <button onclick="generateCode()">Generate Code</button>
    <div id="codeDisplay"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

  <!-- Firebase and app logic -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
      authDomain: "attendance-d7de7.firebaseapp.com",
      databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
      projectId: "attendance-d7de7",
      storageBucket: "attendance-d7de7.appspot.com",
      messagingSenderId: "470494624998",
      appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function generateCode() {
      const subject = document.getElementById("subject").value.trim();
      if (!subject) {
        alert("Please enter a subject name.");
        return;
      }

      const code = Math.floor(100000 + Math.random() * 900000).toString();
      const timestamp = new Date().toISOString();

      database.ref("attendance_codes/" + code).set({
        subject,
        timestamp
      }).then(() => {
        document.getElementById("codeDisplay").innerText = `Code: ${code}`;
      }).catch((error) => {
        console.error("Error saving code to Firebase:", error);
        alert("Failed to generate code. Try again.");
      });
    }
  </script>
</body>
</html>
