<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f6fb;
    }

    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .btn {
      display: inline-block;
      background-color: #28a745;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #218838;
    }

    #generatedCode {
      font-size: 20px;
      color: #007bff;
      font-weight: bold;
      margin: 15px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #fff;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .section-title {
      margin-top: 40px;
      font-size: 20px;
      color: #444;
      border-bottom: 2px solid #007bff;
      display: inline-block;
      padding-bottom: 4px;
    }

    @media (max-width: 768px) {
      .btn {
        width: 100%;
      }

      table {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Teacher Dashboard</h2>

    <button class="btn" onclick="generateAttendanceCode()">Generate Attendance Code</button>
    <div id="generatedCode">Code: ----</div>

    <div class="section-title">Subjects</div>
    <ul id="subjectsList">
      <!-- Dynamically insert subject list from Firebase -->
    </ul>

    <div class="section-title">Registered Students</div>
    <table>
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Email</th>
          <th>Attendance Status</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <!-- Student data will appear here -->
      </tbody>
    </table>
  </div>

  <!-- ✅ Firebase + Script -->
  <script type="module">
    // Import Firebase from your own firebase.js file
    import { db } from './firebase.js';
    import { ref, set, get, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const codeDisplay = document.getElementById("generatedCode");

    function generateAttendanceCode() {
      const code = Math.floor(100000 + Math.random() * 900000).toString();
      codeDisplay.textContent = `Code: ${code}`;

      // Upload to Firebase
      const codeRef = ref(db, 'attendanceCodes/currentCode');
      set(codeRef, {
        code: code,
        timestamp: new Date().toISOString()
      });
    }

    // Populate subjects and students (add your logic as needed)
  </script>

</body>
</html>
