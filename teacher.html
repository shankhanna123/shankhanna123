<!DOCTYPE html>
<html>
<head>
  <title>Teacher Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f7f7f7; }
    h2 { margin-top: 30px; }
    .subject-box { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .btn { padding: 8px 16px; margin: 5px 0; border: none; border-radius: 5px; cursor: pointer; }
    .btn-primary { background: #4CAF50; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    input, select { padding: 8px; width: 100%; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
    .form-inline { display: flex; flex-wrap: wrap; gap: 10px; }
    .form-inline div { flex: 1; min-width: 150px; }
  </style>
</head>
<body>
  <h1>Welcome, <span id="teacherName"></span></h1>

  <h2>Add Subject</h2>
  <div class="form-inline">
    <input type="text" id="subjectNameInput" placeholder="Enter Subject Name" required>
    <button class="btn btn-primary" onclick="addSubject()">Add Subject</button>
  </div>

  <h2>Your Subjects</h2>
  <div id="subjectList"></div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
  authDomain: "attendance-d7de7.firebaseapp.com",
  databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
  projectId: "attendance-d7de7",
  storageBucket: "attendance-d7de7.appspot.com",
  messagingSenderId: "470494624998",
  appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let teacherUID = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        teacherUID = user.uid;
        document.getElementById('teacherName').textContent = user.email;
        loadSubjects();
      } else {
        window.location.href = "login.html";
      }
    });

    function addSubject() {
      const subjectName = document.getElementById("subjectNameInput").value.trim();
      if (!subjectName) return alert("Enter subject name");

      const subjectRef = push(ref(db, `teachers/${teacherUID}/subjects`));
      set(subjectRef, {
        name: subjectName,
        createdAt: new Date().toISOString()
      }).then(() => {
        document.getElementById("subjectNameInput").value = "";
        loadSubjects();
      });
    }

    function loadSubjects() {
      const container = document.getElementById("subjectList");
      container.innerHTML = "";

      const subjectsRef = ref(db, `teachers/${teacherUID}/subjects`);
      onValue(subjectsRef, snapshot => {
        container.innerHTML = "";
        snapshot.forEach(child => {
          const subjectId = child.key;
          const subject = child.val();
          const box = document.createElement("div");
          box.className = "subject-box";
          box.innerHTML = `
            <h3>${subject.name}</h3>
            <button class="btn btn-primary" onclick="showStudentForm('${subjectId}')">Add Student</button>
            <div id="studentForm-${subjectId}" style="margin-top: 10px;"></div>
          `;
          container.appendChild(box);
        });
      });
    }

    window.showStudentForm = function(subjectId) {
      const container = document.getElementById(`studentForm-${subjectId}`);
      container.innerHTML = `
        <div class="form-inline">
          <div><input type="text" id="enroll-${subjectId}" placeholder="Enrollment No" required></div>
          <div><input type="text" id="name-${subjectId}" placeholder="Student Name" required></div>
          <div><input type="text" id="class-${subjectId}" placeholder="Class" required></div>
          <div>
            <select id="gender-${subjectId}" required>
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div><input type="text" id="caste-${subjectId}" placeholder="Caste (optional)"></div>
          <div><button class="btn btn-primary" onclick="addStudent('${subjectId}')">Submit</button></div>
        </div>
      `;
    }

    function generatePassword(length = 6) {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      return Array.from({ length }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    }

    window.addStudent = function(subjectId) {
      const enroll = document.getElementById(`enroll-${subjectId}`).value.trim();
      const name = document.getElementById(`name-${subjectId}`).value.trim();
      const sclass = document.getElementById(`class-${subjectId}`).value.trim();
      const gender = document.getElementById(`gender-${subjectId}`).value;
      const caste = document.getElementById(`caste-${subjectId}`).value.trim();
      const password = generatePassword();
      const email = `${enroll}@student.edu`;

      if (!enroll || !name || !sclass || !gender) {
        alert("All required fields must be filled.");
        return;
      }

      const studentData = {
        enrollment: enroll,
        name: name,
        class: sclass,
        gender: gender,
        caste: caste,
        email: email,
        password: password,
        subjectId: subjectId
      };

      // Save student data under teacher > subject
      const studentRef = ref(db, `teachers/${teacherUID}/subjects/${subjectId}/students/${enroll}`);
      set(studentRef, studentData);

      // Save student login under global "students" node
      const globalStudentRef = ref(db, `students/${enroll}`);
      set(globalStudentRef, {
        ...studentData,
        teacher: teacherUID
      }).then(() => {
        alert(`Student added!\nLogin ID: ${enroll}\nPassword: ${password}`);
        loadSubjects();
      });
    }
  </script>
</body>
</html>
