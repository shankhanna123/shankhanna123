<!DOCTYPE html>
<html>
<head>
  <title>Teacher Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="firebaseConfig.js"></script>
</head>
<body>
  <h2>Welcome Teacher</h2>
  <input id="subject" placeholder="Enter Subject" />
  <button onclick="createSubject()">Create Subject</button>
  <button onclick="generateCode()">Generate Code</button>
  <p>Generated Code: <span id="codeDisplay"></span></p>
  <button onclick="exportCSV()">Export Attendance CSV</button>
  <ul id="studentsList"></ul>

  <script>
    function createSubject() {
      const sub = document.getElementById("subject").value.trim();
      const uid = auth.currentUser.uid;
      if (!sub) return alert("Enter a subject!");
      db.ref("teachers/" + uid + "/subjects").push({ name: sub });
    }

    function generateCode() {
      const code = Math.floor(1000 + Math.random() * 9000).toString();
      db.ref("attendanceCodes/currentCode").set(code);
      db.ref("attendanceCodes/startTime").set(Date.now());
      document.getElementById("codeDisplay").innerText = code;
    }

    function exportCSV() {
      db.ref("attendanceRecords").once("value", snap => {
        let csv = "Name,Status,Reason,Timestamp\n";
        snap.forEach(child => {
          const data = child.val();
          csv += `${data.name},${data.status},${data.reason || ""},${data.timestamp}\n`;
        });
        const blob = new Blob([csv], { type: "text/csv" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "attendance.csv";
        link.click();
      });
    }
  </script>
</body>
</html>
