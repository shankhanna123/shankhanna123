<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="firebase.js"></script>
  <style>
    .box { margin-top: 20px; }
    .subject-card:hover { background: #f5f5f5; cursor: pointer; }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title">Welcome, Teacher</h1>

      <!-- Subject Add -->
      <div class="box">
        <h2 class="subtitle">Add Subject</h2>
        <div class="field">
          <div class="control">
            <input id="subjectName" class="input" type="text" placeholder="Subject Name">
          </div>
        </div>
        <button class="button is-primary" onclick="addSubject()">Add Subject</button>
      </div>

      <!-- View Subjects -->
      <div class="box">
        <h2 class="subtitle">Subjects</h2>
        <div id="subjectsList"></div>
      </div>

      <!-- Add Student Modal Trigger -->
      <div class="box">
        <h2 class="subtitle">Student Management</h2>
        <button class="button is-link" onclick="document.getElementById('studentModal').classList.add('is-active')">Add Student</button>
      </div>

      <!-- Student Modal -->
      <div id="studentModal" class="modal">
        <div class="modal-background" onclick="closeStudentModal()"></div>
        <div class="modal-card">
          <header class="modal-card-head">
            <p class="modal-card-title">Add Student</p>
            <button class="delete" aria-label="close" onclick="closeStudentModal()"></button>
          </header>
          <section class="modal-card-body">
            <div class="field">
              <label class="label">Enrollment No.</label>
              <div class="control">
                <input id="enrollNo" class="input" type="text" required>
              </div>
            </div>
            <div class="field">
              <label class="label">Name</label>
              <div class="control">
                <input id="studentName" class="input" type="text" required>
              </div>
            </div>
            <div class="field">
              <label class="label">Class</label>
              <div class="control">
                <input id="studentClass" class="input" type="text" required>
              </div>
            </div>
            <div class="field">
              <label class="label">Gender</label>
              <div class="control">
                <input id="studentGender" class="input" type="text" required>
              </div>
            </div>
            <div class="field">
              <label class="label">Caste (optional)</label>
              <div class="control">
                <input id="studentCaste" class="input" type="text">
              </div>
            </div>
            <div class="field">
              <label class="label">Subject</label>
              <div class="control">
                <input id="studentSubject" class="input" type="text" required>
              </div>
            </div>
          </section>
          <footer class="modal-card-foot">
            <button class="button is-success" onclick="addStudent()">Save</button>
            <button class="button" onclick="closeStudentModal()">Cancel</button>
          </footer>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import { db, auth } from './firebase.js';
    import { ref, push, set, child, get } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js';
    import { getAuth } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js';

    const teacherId = auth.currentUser?.uid;

    window.addSubject = async () => {
      const subject = document.getElementById('subjectName').value.trim();
      if (!subject || !teacherId) return;
      const subjectRef = ref(db, `teachers/${teacherId}/subjects/${subject}`);
      await set(subjectRef, { created: new Date().toISOString() });
      document.getElementById('subjectName').value = '';
      loadSubjects();
    };

    window.loadSubjects = async () => {
      const listDiv = document.getElementById('subjectsList');
      listDiv.innerHTML = '';
      const snapshot = await get(ref(db, `teachers/${teacherId}/subjects`));
      if (!snapshot.exists()) return;
      const subjects = snapshot.val();
      for (const subject in subjects) {
        const div = document.createElement('div');
        div.className = 'box subject-card';
        div.innerHTML = `<strong>${subject}</strong> <button class="button is-small is-info is-pulled-right" onclick="viewSubject('${subject}')">View</button>`;
        listDiv.appendChild(div);
      }
    };

    window.viewSubject = async (subject) => {
      const studentsRef = ref(db, `teachers/${teacherId}/subjects/${subject}/students`);
      const snapshot = await get(studentsRef);
      if (!snapshot.exists()) {
        alert('No students found for this subject.');
        return;
      }
      const students = snapshot.val();
      let csv = 'Enrollment No,Name,Class,Gender,Caste\n';
      for (const id in students) {
        const s = students[id];
        csv += `${id},${s.name},${s.class},${s.gender},${s.caste || ''}\n`;
      }
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${subject}_students.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };

    window.closeStudentModal = () => {
      document.getElementById('studentModal').classList.remove('is-active');
    };

    window.addStudent = async () => {
      const enrollNo = document.getElementById('enrollNo').value.trim();
      const name = document.getElementById('studentName').value.trim();
      const sclass = document.getElementById('studentClass').value.trim();
      const gender = document.getElementById('studentGender').value.trim();
      const caste = document.getElementById('studentCaste').value.trim();
      const subject = document.getElementById('studentSubject').value.trim();
      if (!enrollNo || !name || !sclass || !gender || !subject) {
        alert('Please fill all required fields.');
        return;
      }
      const password = Math.random().toString(36).slice(-6);
      const studentData = { name, class: sclass, gender, caste, password };
      await set(ref(db, `teachers/${teacherId}/subjects/${subject}/students/${enrollNo}`), studentData);
      await set(ref(db, `students/${enrollNo}`), { ...studentData, subject, teacherId });
      closeStudentModal();
      alert(`Student added. ID: ${enrollNo}, Password: ${password}`);
    };

    loadSubjects();
  </script>
</body>
</html>
