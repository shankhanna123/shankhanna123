<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Attendance Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
    }
    #generateCode {
      padding: 10px 20px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    #generateCode:hover {
      background-color: #0056b3;
    }
    #codeDisplay {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Teacher Dashboard</h1>
  <button id="generateCode">Generate Code</button>
  <p id="codeDisplay"></p>

  <!-- Firebase v8 JS SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
      authDomain: "attendance-d7de7.firebaseapp.com",
      databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
      projectId: "attendance-d7de7",
      storageBucket: "attendance-d7de7.appspot.com",
      messagingSenderId: "470494624998",
      appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
  </script>

  <!-- Custom Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const generateBtn = document.getElementById("generateCode");
      const codeDisplay = document.getElementById("codeDisplay");

      generateBtn.addEventListener("click", () => {
        const code = Math.floor(100000 + Math.random() * 900000); // 6-digit code
        codeDisplay.textContent = "Generated Code: " + code;

        // Save to Firebase
        database.ref("currentCode").set({
          code: code,
          timestamp: new Date().toISOString()
        });
      });
    });
  </script>

</body>
</html>
