<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: auto;
    }
    h1, h2 {
      color: #333;
    }
    input, select, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
    }
    .subject-box, .student-box {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Teacher Dashboard</h1>
  <div>
    <h2>Add Subject</h2>
    <input type="text" id="subjectInput" placeholder="Enter subject name" />
    <button onclick="addSubject()">Add Subject</button>
  </div>
  <div>
    <h2>View Subjects</h2>
    <button onclick="loadSubjects()">View Subjects</button>
    <div id="subjectList"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DB_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  let currentUser;

  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
    } else {
      window.location.href = 'teacher-login.html';
    }
  });

  function addSubject() {
    const subject = document.getElementById("subjectInput").value.trim();
    if (!subject) return alert("Enter subject name");

    const subjectRef = db.ref(`teachers/${currentUser.uid}/subjects/${subject}`);
    subjectRef.set({ createdAt: Date.now() });
    alert("Subject added");
    document.getElementById("subjectInput").value = '';
  }

  function loadSubjects() {
    const subjectList = document.getElementById("subjectList");
    subjectList.innerHTML = '';

    db.ref(`teachers/${currentUser.uid}/subjects`).once('value', snapshot => {
      snapshot.forEach(subjectSnap => {
        const subjectName = subjectSnap.key;
        const div = document.createElement('div');
        div.className = 'subject-box';
        div.innerHTML = `
          <strong>${subjectName}</strong>
          <br>
          <button onclick="viewStudents('${subjectName}')">View Students</button>
          <button onclick="generateCode('${subjectName}')">Generate Attendance Code</button>
          <button onclick="exportAttendance('${subjectName}')">Export Attendance</button>
          <div id="students-${subjectName}" class="student-box hidden"></div>
        `;
        subjectList.appendChild(div);
      });
    });
  }

  function viewStudents(subjectName) {
    const box = document.getElementById(`students-${subjectName}`);
    box.innerHTML = '';
    box.classList.remove('hidden');

    db.ref(`teachers/${currentUser.uid}/subjects/${subjectName}/students`).once('value', snap => {
      snap.forEach(child => {
        const student = child.val();
        const div = document.createElement('div');
        div.textContent = `${student.name} - ${student.email}`;
        box.appendChild(div);
      });
    });
  }

  function generateCode(subjectName) {
    const code = Math.floor(100000 + Math.random() * 900000);
    db.ref(`attendanceCodes/${currentUser.uid}/${subjectName}`).set({
      code,
      timestamp: Date.now()
    });
    alert(`Code for ${subjectName} is ${code}`);
  }

  function exportAttendance(subjectName) {
    const attendanceRef = db.ref(`teachers/${currentUser.uid}/subjects/${subjectName}/attendance`);
    attendanceRef.once('value', snapshot => {
      const data = [];
      snapshot.forEach(dateSnap => {
        const date = dateSnap.key;
        const studentData = dateSnap.val();
        for (let studentId in studentData) {
          data.push({
            Date: date,
            Student: studentData[studentId].name,
            Email: studentData[studentId].email,
            Status: studentData[studentId].status
          });
        }
      });

      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Attendance");
      XLSX.writeFile(wb, `${subjectName}_Attendance.xlsx`);
    });
  }
</script>
</body>
</html>
