<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Dashboard</title>
  <script type="module" src="./firebase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      padding: 20px;
    }
    h2, h3 {
      color: #333;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    input, button, select {
      margin: 5px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .subject-block {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>Welcome, <span id="teacherName"></span>!</h2>  <div class="container">
    <h3>Add Subject</h3>
    <input type="text" id="subjectName" placeholder="Enter subject name">
    <button onclick="addSubject()">Add</button>
  </div>  <div class="container">
    <h3>Register Student</h3>
    <select id="subjectList"></select>
    <input type="text" id="studentName" placeholder="Student name">
    <input type="email" id="studentEmail" placeholder="Student email">
    <input type="password" id="studentPassword" placeholder="Password">
    <button onclick="registerStudent()">Register</button>
  </div>  <div id="subjectsContainer"></div>  <script type="module">
    import { db, auth } from './firebase.js';
    import { ref, set, get, push, onValue, update, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    let teacherId = "";

    onAuthStateChanged(auth, user => {
      if (user) {
        teacherId = user.uid;
        document.getElementById("teacherName").innerText = user.email;
        loadSubjects();
      } else {
        window.location.href = "teacher-login.html";
      }
    });

    async function addSubject() {
      const name = document.getElementById("subjectName").value;
      const subRef = push(ref(db, `teachers/${teacherId}/subjects`));
      await set(subRef, {
        name,
        students: {},
        attendance: {}
      });
      loadSubjects();
    }

    function loadSubjects() {
      const container = document.getElementById("subjectsContainer");
      const dropdown = document.getElementById("subjectList");
      container.innerHTML = "";
      dropdown.innerHTML = "";

      const subjectsRef = ref(db, `teachers/${teacherId}/subjects`);
      onValue(subjectsRef, snapshot => {
        container.innerHTML = "";
        dropdown.innerHTML = "";
        const data = snapshot.val();
        if (!data) return;

        for (const [id, sub] of Object.entries(data)) {
          dropdown.innerHTML += `<option value="${id}">${sub.name}</option>`;

          const block = document.createElement("div");
          block.className = "subject-block";
          block.innerHTML = `
            <h3>${sub.name}</h3>
            <button onclick="generateCode('${id}')">Generate Code</button>
            <button onclick="exportToExcel('${id}', '${sub.name}')">Export Excel</button>
            <button onclick="exportToPDF('${id}', '${sub.name}')">Export PDF</button>
            <p>Code: <span id="code-${id}">${sub.code || ''}</span></p>
            <ul id="student-list-${id}"></ul>
          `;
          container.appendChild(block);

          const studentList = document.getElementById(`student-list-${id}`);
          if (sub.students) {
            for (const [sid, student] of Object.entries(sub.students)) {
              const li = document.createElement("li");
              li.innerText = `${student.name} - ${sid}`;
              studentList.appendChild(li);
            }
          }
        }
      });
    }

    window.generateCode = async function(subjectId) {
      const code = Math.floor(100000 + Math.random() * 900000);
      await update(ref(db, `teachers/${teacherId}/subjects/${subjectId}`), { code });
      document.getElementById(`code-${subjectId}`).innerText = code;
    }

    window.registerStudent = async function() {
      const subjectId = document.getElementById("subjectList").value;
      const name = document.getElementById("studentName").value;
      const email = document.getElementById("studentEmail").value;
      const password = document.getElementById("studentPassword").value;

      const userCred = await auth.createUserWithEmailAndPassword(email, password);
      const uid = userCred.user.uid;

      await set(ref(db, `teachers/${teacherId}/subjects/${subjectId}/students/${uid}`), { name, email });
      loadSubjects();
    }

    window.exportToExcel = async function(subjectId, subjectName) {
      const snap = await get(ref(db, `teachers/${teacherId}/subjects/${subjectId}/attendance`));
      const data = snap.val();
      const rows = [["Student ID", "Date", "Status"]];
      if (data) {
        for (const [date, students] of Object.entries(data)) {
          for (const [sid, status] of Object.entries(students)) {
            rows.push([sid, date, status]);
          }
        }
      }
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, subjectName);
      XLSX.writeFile(wb, `${subjectName}-Attendance.xlsx`);
    }

    window.exportToPDF = async function(subjectId, subjectName) {
      const snap = await get(ref(db, `teachers/${teacherId}/subjects/${subjectId}/attendance`));
      const data = snap.val();
      const doc = new jspdf.jsPDF();
      doc.setFontSize(14);
      doc.text(`Attendance for ${subjectName}`, 10, 10);
      let y = 20;
      if (data) {
        for (const [date, students] of Object.entries(data)) {
          doc.text(`${date}:`, 10, y);
          y += 6;
          for (const [sid, status] of Object.entries(students)) {
            doc.text(`  ${sid}: ${status}`, 10, y);
            y += 6;
          }
          y += 4;
        }
      }
      doc.save(`${subjectName}-Attendance.pdf`);
    }
  </script></body>
</html>
