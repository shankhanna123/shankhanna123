<!DOCTYPE html>
<html>
<head>
  <title>Teacher Dashboard</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #e3eeff 0%, #f9faff 100%);
      color: #222;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #4364f7 0%, #6fb1fc 100%);
      color: white;
      padding: 32px 0 26px 0;
      text-align: center;
      box-shadow: 0 6px 28px rgba(67, 100, 247, 0.15);
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
      position: relative;
    }

    header h1 {
      font-size: 2.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    /* Signout button styles */
    #sign-out-btn {
      position: absolute;
      top: 38px;
      right: 38px;
      background: linear-gradient(90deg, #4364f7 0%, #6fb1fc 100%);
      color: white;
      border: none;
      padding: 13px 32px;
      font-size: 1.07rem;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(67, 100, 247, 0.08);
      margin: 0 4px 10px 0;
      transition: background 0.18s, transform 0.12s;
    }
    #sign-out-btn:hover {
      background: linear-gradient(90deg, #3350b7 0%, #5191e1 100%);
      transform: translateY(-2px) scale(1.03);
    }

    /* ...rest of your CSS remains unchanged... */
    main {
      padding: 48px 12px 32px 12px;
      max-width: 1100px;
      margin: auto;
    }

    .section {
      background: #fff;
      border-radius: 22px;
      padding: 36px 32px 32px 32px;
      margin-bottom: 38px;
      box-shadow: 0 8px 28px rgba(67, 100, 247, 0.07), 0 1.5px 5px rgba(100,150,255,0.04);
      transition: box-shadow 0.2s;
    }

    .section:hover {
      box-shadow: 0 12px 36px rgba(67, 100, 247, 0.13), 0 2px 8px rgba(100,150,255,0.07);
    }

    h2, h3, h4 {
      color: #4364f7;
      margin-top: 0;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ...keep all your other styles unchanged... */
  </style>
</head>
<body>
  <header>
    <h1>Teacher Dashboard</h1>
    <button id="sign-out-btn">Sign Out</button>
  </header>

  <main>
    <div class="section">
      <h2>Add New Subject</h2>
      <input type="text" id="subject-name" placeholder="Enter Subject Name" />
      <button id="add-subject-btn">Add Subject</button>
    </div>

    <div class="section">
      <h2>Your Subjects</h2>
      <div id="subjects-container">
        <!-- Subject sections added dynamically -->
      </div>
    </div>
  </main>

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- SheetJS for Excel export -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
      authDomain: "attendance-d7de7.firebaseapp.com",
      databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
      projectId: "attendance-d7de7",
      storageBucket: "attendance-d7de7.appspot.com",
      messagingSenderId: "470494624998",
      appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
  <script src="teacher.js"></script>
  <script>
    // Sign out logic
    document.getElementById('sign-out-btn').onclick = function() {
      firebase.auth().signOut().then(function() {
        window.location.href = "login.html"; // Redirects to login.html after sign out
      }).catch(function(error) {
        alert("Error signing out: " + error.message);
      });
    };
  </script>
</body>
</html>
