<!DOCTYPE html>
<html>
<head>
  <title>Teacher Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .subject-container { margin-top: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 10px; }
    .subject-header { display: flex; justify-content: space-between; align-items: center; }
    .students-list { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Welcome, Teacher</h1>
  <button onclick="addSubject()">Add Subject</button>
  <div id="subjectsContainer"></div>

  <script>
    // Firebase Config (Replace with your config)
    const firebaseConfig = {
  apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
  authDomain: "attendance-d7de7.firebaseapp.com",
  databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
  projectId: "attendance-d7de7",
  storageBucket: "attendance-d7de7.appspot.com",
  messagingSenderId: "470494624998",
  appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
};
    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged(function(user) {
      if (user) {
        loadSubjects(user.uid);
      } else {
        alert("Not logged in");
        window.location.href = "login.html";
      }
    });

    function addSubject() {
      const subjectName = prompt("Enter subject name:");
      if (!subjectName) return;
      const user = firebase.auth().currentUser;
      if (!user) return;

      const subjectId = Date.now();
      firebase.database().ref(`teachers/${user.uid}/subjects/${subjectId}`).set({
        name: subjectName
      }).then(() => {
        alert("Subject added");
        loadSubjects(user.uid);
      });
    }

    function loadSubjects(teacherId) {
      document.getElementById('subjectsContainer').innerHTML = '';
      firebase.database().ref(`teachers/${teacherId}/subjects`).once('value', (snapshot) => {
        snapshot.forEach((subjectSnap) => {
          const subjectId = subjectSnap.key;
          const subjectData = subjectSnap.val();
          renderSubject(subjectId, subjectData, teacherId);
        });
      });
    }

    function renderSubject(subjectId, subjectData, teacherId) {
      const div = document.createElement('div');
      div.className = 'subject-container';
      div.innerHTML = `
        <div class="subject-header">
          <h3>${subjectData.name}</h3>
          <div>
            <button onclick="addStudent('${teacherId}', '${subjectId}')">Add Student</button>
            <button onclick="viewStudents('${teacherId}', '${subjectId}')">View Students</button>
            <button onclick="exportToCSV('${teacherId}', '${subjectId}', '${subjectData.name}')">Export to CSV</button>
          </div>
        </div>
        <div class="students-list" id="students-${subjectId}"></div>
      `;
      document.getElementById('subjectsContainer').appendChild(div);
    }

    function addStudent(teacherId, subjectId) {
      const enrollment = prompt("Enrollment No. (Required):");
      const name = prompt("Name (Required):");
      const studentClass = prompt("Class (Required):");
      const gender = prompt("Gender (Required):");
      const caste = prompt("Caste (Optional):");
      if (!enrollment || !name || !studentClass || !gender) {
        alert("All required fields must be filled");
        return;
      }
      const password = Math.random().toString(36).slice(-6);
      const studentData = {
        enrollment, name, class: studentClass, gender, caste, password
      };
      firebase.database().ref(`teachers/${teacherId}/subjects/${subjectId}/students/${enrollment}`).set(studentData);
      firebase.database().ref(`students/${enrollment}`).set({
        password,
        teacherId,
        subjectId
      });
      alert(`Student ${name} added with password: ${password}`);
    }

    function viewStudents(teacherId, subjectId) {
      const container = document.getElementById(`students-${subjectId}`);
      container.innerHTML = '';
      firebase.database().ref(`teachers/${teacherId}/subjects/${subjectId}/students`).once('value', (snapshot) => {
        snapshot.forEach((snap) => {
          const s = snap.val();
          const div = document.createElement('div');
          div.innerText = `${s.enrollment} - ${s.name} (${s.class}) - Gender: ${s.gender}`;
          container.appendChild(div);
        });
      });
    }

    function exportToCSV(teacherId, subjectId, subjectName) {
      firebase.database().ref(`teachers/${teacherId}/subjects/${subjectId}/students`).once('value', (snapshot) => {
        const rows = [["Enrollment", "Name", "Class", "Gender", "Caste"]];
        snapshot.forEach((snap) => {
          const s = snap.val();
          rows.push([s.enrollment, s.name, s.class, s.gender, s.caste || '']);
        });
        const worksheet = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, worksheet, subjectName);
        XLSX.writeFile(wb, `${subjectName}_students.xlsx`);
      });
    }
  </script>
</body>
</html>
