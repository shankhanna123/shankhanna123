<!DOCTYPE html><html>
<head>
  <title>Teacher Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <h2>Teacher Dashboard</h2>
  <input type="text" id="subjectName" placeholder="Enter Subject Name">
  <button onclick="addSubject()">Add Subject</button>  <div id="subjectsContainer"></div>  <script>
    // Your existing Firebase config
    const firebaseConfig = {
  apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
  authDomain: "attendance-d7de7.firebaseapp.com",
  databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
  projectId: "attendance-d7de7",
  storageBucket: "attendance-d7de7.appspot.com",
  messagingSenderId: "470494624998",
  appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
};
    firebase.initializeApp(firebaseConfig);

    const user = firebase.auth().currentUser;
    let currentUserId;

    firebase.auth().onAuthStateChanged((loggedInUser) => {
      if (loggedInUser) {
        currentUserId = loggedInUser.uid;
        loadSubjects();
      }
    });

    function addSubject() {
      const subjectName = document.getElementById("subjectName").value.trim();
      if (!subjectName) return alert("Enter subject name");

      const subjectRef = firebase.database().ref(`teachers/${currentUserId}/subjects`).push();
      subjectRef.set({
        name: subjectName
      });
    }

    function loadSubjects() {
      firebase.database().ref(`teachers/${currentUserId}/subjects`).on("value", snapshot => {
        const container = document.getElementById("subjectsContainer");
        container.innerHTML = "";
        snapshot.forEach(subjectSnap => {
          const subjectId = subjectSnap.key;
          const subject = subjectSnap.val();
          const div = document.createElement("div");
          div.innerHTML = `
            <h3>${subject.name}</h3>
            <button onclick="generateCode('${subjectId}')">Generate Code</button>
            <button onclick="exportAttendance('${subjectId}', '${subject.name}', 'excel')">Export Excel</button>
            <button onclick="exportAttendance('${subjectId}', '${subject.name}', 'pdf')">Export PDF</button>
            <button onclick="showAddStudentForm('${subjectId}')">Add Student</button>
            <div id="studentForm-${subjectId}" style="display:none;">
              <input type="text" id="enroll-${subjectId}" placeholder="Enrollment No" required>
              <input type="text" id="name-${subjectId}" placeholder="Name" required>
              <input type="text" id="class-${subjectId}" placeholder="Class" required>
              <select id="gender-${subjectId}">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
              <input type="text" id="caste-${subjectId}" placeholder="Caste (optional)">
              <button onclick="addStudent('${subjectId}')">Register Student</button>
            </div>
            <ul id="studentList-${subjectId}"></ul>
          `;
          container.appendChild(div);
          loadStudents(subjectId);
        });
      });
    }

    function showAddStudentForm(subjectId) {
      document.getElementById(`studentForm-${subjectId}`).style.display = 'block';
    }

    function generateRandomPassword(length = 6) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from({length}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    }

    function addStudent(subjectId) {
      const enroll = document.getElementById(`enroll-${subjectId}`).value.trim();
      const name = document.getElementById(`name-${subjectId}`).value.trim();
      const studentClass = document.getElementById(`class-${subjectId}`).value.trim();
      const gender = document.getElementById(`gender-${subjectId}`).value;
      const caste = document.getElementById(`caste-${subjectId}`).value.trim();

      if (!enroll || !name || !studentClass || !gender) return alert("Please fill all required fields");

      const email = enroll + "@student.attendance.com";
      const password = generateRandomPassword();

      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(userCredential => {
          const studentData = { enroll, name, class: studentClass, gender, caste, password };
          firebase.database().ref(`teachers/${currentUserId}/subjects/${subjectId}/students/${enroll}`).set(studentData);
          alert(`Student ${name} registered with password: ${password}`);
        })
        .catch(error => alert("Error: " + error.message));
    }

    function loadStudents(subjectId) {
      const list = document.getElementById(`studentList-${subjectId}`);
      firebase.database().ref(`teachers/${currentUserId}/subjects/${subjectId}/students`).on("value", snapshot => {
        list.innerHTML = "";
        snapshot.forEach(child => {
          const s = child.val();
          const li = document.createElement("li");
          li.textContent = `${s.enroll} - ${s.name}`;
          list.appendChild(li);
        });
      });
    }

    function generateCode(subjectId) {
      const code = Math.floor(100000 + Math.random() * 900000);
      firebase.database().ref(`teachers/${currentUserId}/subjects/${subjectId}/attendanceCode`).set(code);
      alert("Attendance code generated: " + code);
    }

    async function exportAttendance(subjectId, subjectName, format) {
      const snapshot = await firebase.database().ref(`teachers/${currentUserId}/subjects/${subjectId}/students`).once("value");
      const data = [];
      snapshot.forEach(child => {
        const s = child.val();
        data.push({ Enrollment: s.enroll, Name: s.name, Class: s.class, Gender: s.gender, Caste: s.caste });
      });

      if (format === 'excel') {
        const worksheet = XLSX.utils.json_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, subjectName);
        XLSX.writeFile(workbook, `${subjectName}_Attendance.xlsx`);
      } else {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text(`${subjectName} Attendance`, 10, 10);
        let y = 20;
        data.forEach(s => {
          doc.text(`${s.Enrollment} - ${s.Name} - ${s.Class} - ${s.Gender} - ${s.Caste}`, 10, y);
          y += 10;
        });
        doc.save(`${subjectName}_Attendance.pdf`);
      }
    }
  </script></body>
</html>
