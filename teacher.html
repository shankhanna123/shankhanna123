<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f9ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    h2 {
      color: #333;
    }

    #codeDisplay {
      font-size: 24px;
      font-weight: bold;
      color: #0066cc;
      margin: 20px 0;
    }

    button {
      padding: 10px 20px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #004999;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Teacher Dashboard</h2>
    <button onclick="generateCode()">Generate Code</button>
    <div id="codeDisplay">Code: -</div>
    <div class="status" id="statusMessage"></div>
  </div>

  <!-- Firebase SDK via CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
      authDomain: "attendance-d7de7.firebaseapp.com",
      projectId: "attendance-d7de7",
      storageBucket: "attendance-d7de7.appspot.com",
      messagingSenderId: "470494624998",
      appId: "1:470494624998:web:be5b5bdfb9b515d079cf27"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Generate and store code
    function generateCode() {
      const code = Math.floor(100000 + Math.random() * 900000);
      const timestamp = new Date().toISOString();

      document.getElementById("codeDisplay").innerText = "Code: " + code;

      database.ref("codes/" + timestamp).set({
        code: code,
        createdAt: timestamp
      })
      .then(() => {
        document.getElementById("statusMessage").innerText = "Code saved successfully!";
      })
      .catch((error) => {
        document.getElementById("statusMessage").innerText = "Error: " + error.message;
      });
    }
  </script>
</body>
</html>
