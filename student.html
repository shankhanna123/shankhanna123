<!DOCTYPE html>
<html>
<head>
  <title>Student Attendance</title>
  <style>
    body { font-family: Arial; text-align: center; background: #f4f4f4; padding: 40px; }
    .box { background: white; padding: 30px; border-radius: 10px; max-width: 300px; margin: auto; box-shadow: 0 0 10px #ccc; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; }
    .timer { font-weight: bold; margin-top: 10px; color: red; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="firebaseConfig.js"></script>
</head>
<body>
  <div class="box">
    <h2>Submit Attendance</h2>
    <input id="studentName" placeholder="Your Name" />
    <input id="codeInput" placeholder="Enter Code" />
    <button id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time left: 60s</div>
    <div id="status"></div>
  </div>

  <script>
    let correctCode = "";
    let timeLeft = 60;
    let timerInterval;

    const codeRef = db.ref("attendanceCodes/currentCode");
    const startTimeRef = db.ref("attendanceCodes/startTime");

    function startTimer(startTimestamp) {
      const now = Date.now();
      const timeElapsed = Math.floor((now - startTimestamp) / 1000);
      timeLeft = 60 - timeElapsed;

      if (timeLeft <= 0) {
        document.getElementById("timer").innerText = "Code Expired!";
        document.getElementById("submitBtn").disabled = true;
        return;
      }

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = `Time left: ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          markAttendance("Absent", "Timeout");
          document.getElementById("submitBtn").disabled = true;
        }
      }, 1000);
    }

    startTimeRef.on("value", snap => {
      const startTimestamp = snap.val();
      if (startTimestamp) startTimer(startTimestamp);
    });

    codeRef.on("value", snap => correctCode = snap.val());

    document.getElementById("submitBtn").onclick = function () {
      clearInterval(timerInterval);
      const name = document.getElementById("studentName").value.trim();
      const enteredCode = document.getElementById("codeInput").value.trim();

      if (!name) return alert("Enter your name!");
      if (enteredCode === correctCode) {
        markAttendance("Present");
      } else {
        markAttendance("Absent", "Incorrect Code");
      }

      this.disabled = true;
    };

    function markAttendance(status, reason = "") {
      const name = document.getElementById("studentName").value.trim();
      db.ref("attendanceRecords/" + name).set({
        name, status, reason, timestamp: new Date().toISOString()
      });
      document.getElementById("status").innerText = `Attendance: ${status}`;
    }
  </script>
</body>
</html>
