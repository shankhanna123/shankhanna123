<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 400px;
      margin: auto;
    }
    h2 {
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h2>Student Registration</h2>
  <input type="text" id="name" placeholder="Enter your full name" required />
  <input type="text" id="enrollment" placeholder="Enter enrollment number" required />
  <input type="text" id="contact" placeholder="Enter contact number" required />
  <button onclick="registerStudent()">Register</button>
  <p id="statusMessage"></p>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js"></script>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>

  <script>
    // Utility: Generate random 6-char alphanumeric password
    function generateRandomPassword() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let password = '';
      for (let i = 0; i < 6; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return password;
    }

    async function registerStudent() {
      const name = document.getElementById('name').value.trim();
      const enrollment = document.getElementById('enrollment').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const statusMessage = document.getElementById('statusMessage');

      if (!name || !enrollment || !contact) {
        alert("Please fill in all fields.");
        return;
      }

      const email = enrollment + "@college.com";  // Used for Firebase Auth
      const password = generateRandomPassword();

      try {
        // Create user in Firebase Auth
        await firebase.auth().createUserWithEmailAndPassword(email, password);

        // Save student info in Realtime Database
        await firebase.database().ref('students/' + enrollment).set({
          name: name,
          contact: contact,
          enrollment: enrollment,
          password: password // optional: remove this if you don't want to store it
        });

        statusMessage.innerText = `✅ Registration successful! Your generated password is: ${password}`;
        statusMessage.style.color = "green";

        // Clear form
        document.getElementById('name').value = '';
        document.getElementById('enrollment').value = '';
        document.getElementById('contact').value = '';
      } catch (error) {
        console.error("Error registering student:", error);
        statusMessage.innerText = `❌ Registration failed: ${error.message}`;
        statusMessage.style.color = "red";
      }
    }
  </script>
</body>
</html>
