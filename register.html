<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 450px;
      margin: auto;
    }
    h2 {
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background-color: #2196F3;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h2>Student Registration</h2>
  <input type="text" id="name" placeholder="Enter your full name" required />
  <input type="text" id="enrollment" placeholder="Enter enrollment number" required />
  <input type="text" id="contact" placeholder="Enter contact number" required />
  <button onclick="registerStudent()">Register as Student</button>

  <hr style="margin: 30px 0;">
  <h2>Teacher Registration</h2>
  <input type="text" id="teacherName" placeholder="Enter teacher name" required />
  <input type="email" id="teacherEmail" placeholder="Enter teacher email" required />
  <input type="password" id="teacherPassword" placeholder="Enter password" required />
  <button class="secondary" onclick="registerTeacher()">Register as Teacher</button>

  <p id="statusMessage"></p>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
      authDomain: "attendance-d7de7.firebaseapp.com",
      databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
      projectId: "attendance-d7de7",
      storageBucket: "attendance-d7de7.appspot.com",
      messagingSenderId: "470494624998",
      appId: "1:470494624998:web:be5b5bdfb9b515d079cf27",
      measurementId: "G-VML3R5N55W"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    function generateRandomPassword() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let password = '';
      for (let i = 0; i < 6; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return password;
    }

    window.registerStudent = async function () {
      const name = document.getElementById('name').value.trim();
      const enrollment = document.getElementById('enrollment').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const statusMessage = document.getElementById('statusMessage');

      if (!name || !enrollment || !contact) {
        alert("Please fill in all student fields.");
        return;
      }

      const email = enrollment + "@college.com";
      const password = generateRandomPassword();

      try {
        await createUserWithEmailAndPassword(auth, email, password);

        await set(ref(db, 'students/' + enrollment), {
          name: name,
          contact: contact,
          enrollment: enrollment,
          password: password
        });

        statusMessage.innerText = `✅ Student registered! Your password is: ${password}`;
        statusMessage.style.color = "green";

        document.getElementById('name').value = '';
        document.getElementById('enrollment').value = '';
        document.getElementById('contact').value = '';
      } catch (error) {
        console.error("Student registration error:", error);
        statusMessage.innerText = `❌ Student registration failed: ${error.message}`;
        statusMessage.style.color = "red";
      }
    };

    window.registerTeacher = async function () {
      const name = document.getElementById('teacherName').value.trim();
      const email = document.getElementById('teacherEmail').value.trim();
      const password = document.getElementById('teacherPassword').value.trim();
      const statusMessage = document.getElementById('statusMessage');

      if (!name || !email || !password) {
        alert("Please fill in all teacher fields.");
        return;
      }

      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);

        await set(ref(db, 'teachers/' + result.user.uid), {
          name: name,
          email: email,
          role: 'teacher'
        });

        statusMessage.innerText = `✅ Teacher registered successfully!`;
        statusMessage.style.color = "green";

        document.getElementById('teacherName').value = '';
        document.getElementById('teacherEmail').value = '';
        document.getElementById('teacherPassword').value = '';
      } catch (error) {
        console.error("Teacher registration error:", error);
        statusMessage.innerText = `❌ Teacher registration failed: ${error.message}`;
        statusMessage.style.color = "red";
      }
    };
  </script>
</body>
</html>
