<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | Attendance App</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .register-container {
      background-color: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }
    .register-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }
    .register-container input,
    .register-container select,
    .register-container button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    .register-container button {
      background-color: #4e54c8;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    .register-container button:hover {
      background-color: #3e44a0;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>Create Account</h2>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <select id="role">
      <option value="">Select Role</option>
      <option value="teacher">Teacher</option>
      <option value="student">Student</option>
    </select>
    <button onclick="registerUser()">Register</button>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
    import { ref, set } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

    async function registerUser() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;

      if (!email || !password || !role) {
        alert("Please fill in all fields.");
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        const userData = {
          uid: user.uid,
          email: user.email,
          role: role
        };

        const userRef = ref(db, role === "teacher" ? `teachers/${user.uid}` : `students/${user.uid}`);
        await set(userRef, userData);

        alert("Registration successful!");
        // Optional redirect:
        // window.location.href = "login.html";
      } catch (error) {
        console.error("Error:", error.message);
        alert("Registration failed: " + error.message);
      }
    }

    // Expose the function to the global scope
    window.registerUser = registerUser;
  </script>
</body>
</html>
