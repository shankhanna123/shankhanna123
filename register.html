<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 450px;
      margin: auto;
    }
    h2 {
      text-align: center;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background-color: #2196F3;
    }
    button:hover {
      opacity: 0.9;
    }
    #statusMessage {
      font-size: 16px;
      margin-bottom: 20px;
      padding: 10px;
      background: #f0f0f0;
      border-left: 5px solid green;
      white-space: pre-wrap;
      color: black;
    }
    .section {
      display: none;
    }
  </style>
</head>
<body>

  <!-- ✅ Success message on top -->
  <p id="statusMessage"></p>

  <!-- ✅ Profile Dropdown -->
  <label for="profile">Select Profile:</label>
  <select id="profile" onchange="toggleForm()">
    <option value="">-- Select --</option>
    <option value="student">Student</option>
    <option value="teacher">Teacher</option>
  </select>

  <!-- ✅ Student Registration -->
  <div id="studentSection" class="section">
    <h2>Student Registration</h2>
    <input type="text" id="name" placeholder="Enter your full name" required />
    <input type="text" id="enrollment" placeholder="Enter enrollment number" required />
    <input type="email" id="studentEmail" placeholder="Enter your email ID" required />
    <input type="text" id="contact" placeholder="Enter contact number" required />
    <button onclick="registerStudent()">Register as Student</button>
  </div>

  <!-- ✅ Teacher Registration -->
  <div id="teacherSection" class="section">
    <h2>Teacher Registration</h2>
    <input type="text" id="teacherName" placeholder="Enter teacher name" required />
    <input type="email" id="teacherEmail" placeholder="Enter teacher email" required />
    <input type="text" id="teacherContact" placeholder="Enter contact number" required />
    <input type="password" id="teacherPassword" placeholder="Enter password" required />
    <button class="secondary" onclick="registerTeacher()">Register as Teacher</button>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDt-pibaL2pMEu19Qgbcl4ir68W8lfqti8",
      authDomain: "attendance-d7de7.firebaseapp.com",
      databaseURL: "https://attendance-d7de7-default-rtdb.firebaseio.com",
      projectId: "attendance-d7de7",
      storageBucket: "attendance-d7de7.appspot.com",
      messagingSenderId: "470494624998",
      appId: "1:470494624998:web:be5b5bdfb9b515d079cf27",
      measurementId: "G-VML3R5N55W"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.toggleForm = function () {
      const selected = document.getElementById("profile").value;
      document.getElementById("studentSection").style.display = selected === "student" ? "block" : "none";
      document.getElementById("teacherSection").style.display = selected === "teacher" ? "block" : "none";
      document.getElementById("statusMessage").innerHTML = "";
    };

    function generateRandomPassword() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let password = '';
      for (let i = 0; i < 6; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return password;
    }

    // ✅ Student Registration
    window.registerStudent = async function () {
      const name = document.getElementById('name').value.trim();
      const enrollment = document.getElementById('enrollment').value.trim();
      const emailInput = document.getElementById('studentEmail').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const statusMessage = document.getElementById('statusMessage');

      if (!name || !enrollment || !emailInput || !contact) {
        alert("Please fill in all student fields.");
        return;
      }

      const email = enrollment + "@college.com";  // used for Firebase Auth
      const password = generateRandomPassword();

      try {
        await createUserWithEmailAndPassword(auth, email, password);

        await set(ref(db, 'students/' + enrollment), {
          name: name,
          enrollment: enrollment,
          contact: contact,
          email: emailInput,
          password: password
        });

        statusMessage.innerHTML =
          "✅ Student registered successfully!\n" +
          "User ID: " + enrollment + "\n" +
          "Password: " + password;

        document.getElementById('name').value = '';
        document.getElementById('enrollment').value = '';
        document.getElementById('studentEmail').value = '';
        document.getElementById('contact').value = '';
      } catch (error) {
        console.error("Student registration error:", error);
        statusMessage.innerText = `❌ Student registration failed: ${error.message}`;
        statusMessage.style.color = "red";
      }
    };

    // ✅ Teacher Registration
    window.registerTeacher = async function () {
      const name = document.getElementById('teacherName').value.trim();
      const email = document.getElementById('teacherEmail').value.trim();
      const contact = document.getElementById('teacherContact').value.trim();
      const password = document.getElementById('teacherPassword').value.trim();
      const statusMessage = document.getElementById('statusMessage');

      if (!name || !email || !contact || !password) {
        alert("Please fill in all teacher fields.");
        return;
      }

      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);

        await set(ref(db, 'teachers/' + result.user.uid), {
          name: name,
          email: email,
          contact: contact,
          role: 'teacher'
        });

        statusMessage.innerText = `✅ Teacher registered successfully!`;
        statusMessage.style.color = "green";

        document.getElementById('teacherName').value = '';
        document.getElementById('teacherEmail').value = '';
        document.getElementById('teacherContact').value = '';
        document.getElementById('teacherPassword').value = '';
      } catch (error) {
        console.error("Teacher registration error:", error);
        statusMessage.innerText = `❌ Teacher registration failed: ${error.message}`;
        statusMessage.style.color = "red";
      }
    };
  </script>
</body>
</html>
